[build]
  publish = "."
  # Compiles only the React tools listed in vite.config.js (sources in tools-src/).
  # Every hand-written tool under tools/ is served exactly as committed and is not
  # touched by this command.
  command = "npm run build"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/agents"
  to   = "/agents/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
