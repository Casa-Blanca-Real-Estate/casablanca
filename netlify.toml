[build]
  # Generates agents/<slug>/index.html, agents/index.html and the generated
  # block in _redirects from agents/data/*.json. Everything else under
  # publish = "." (the tools, css, js, assets) is published as-is, unchanged.
  # The build fails loudly on bad agent data — see agents/SCHEMA.md.
  command = "node agents/build.js"
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# CLAUDE.md: "No esbuild bundling for functions that use @netlify/blobs —
# node_modules ships in the zip." The global setting above contradicts that for
# site/sessions/agents, which all import @netlify/blobs and have apparently been
# deploying fine; resolving that either way is a live risk to three daily-use
# tools, so it is flagged in docs/agent-cms/storage-decision.md for Casanova
# rather than changed here. This override obeys the written constraint for the
# new function without touching how anything else deploys.
[functions."agent-store"]
  node_bundler = "none"

[[redirects]]
  from = "/agents"
  to   = "/agents/index.html"
  status = 200

# publish = "." serves the whole repo root, so everything that isn't meant to be
# a public page has to be refused explicitly. force = true because the files do
# exist — without it Netlify serves them anyway (shadowing). Nothing on the site
# loads from these paths at runtime; every reference to them in served files is
# a comment. Keep this list in sync with anything new that's internal-only.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/agents/data/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/agents/build.js"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/agents/build.test.js"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/agents/SCHEMA.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/agents/site.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/agents/template.html"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/agents/directory.template.html"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tools/agent-cms/verify.spec.mjs"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
