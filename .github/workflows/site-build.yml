# netlify.toml runs `npm run build` — the agent sites, then the comp report —
# on every deploy. A failure anywhere in it stops the whole site deploying: the
# last good deploy stays live, but nothing new ships, agent-site publishes
# included. This runs the same build on every PR so it fails here first.
name: site build

on:
  pull_request:
  push:
    branches: [claude/main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: typecheck the comp report and the dev notebook
        run: npm run typecheck
      - name: the dev notebook's tests (its API on Blobs' local server, the CLI, the rules)
        run: npm run test:dev-notebook
      - name: the Netlify build
        run: npm run build
      - name: the build wrote nothing outside its gitignored output
        # Catches a build that rewrites a hand-written tool or drifts the
        # committed agent pages — anything but tools/comp-report/ (ignored).
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
      - name: the build produced the comp report
        run: |
          test -f tools/comp-report/index.html
          test -f tools/comp-report/build.json

  # The comp report's server tests: the access rule, the Identity check, the
  # API, the streamed turn, and row-level security against a real PostgreSQL —
  # 17, as Netlify Database (Neon) runs. The migrations are applied by a
  # non-superuser owner, as on Netlify.
  comp-report-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      CR_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:comp-report
